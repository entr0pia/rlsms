name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag 名称 (例如 v3.10.1，留空则仅构建并上传产物，不发布 Release)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build noAnalytics Release APK
        run: ./gradlew :presentation:assembleNoAnalyticsRelease --stacktrace

      - name: Sign & Align Android Release APK
        id: sign_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK_DIR="presentation/build/outputs/apk/noAnalytics/release"
          UNSIGNED_APK=$(find "$APK_DIR" -name "*unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          fi
          
          echo "Found unsigned APK: $UNSIGNED_APK"
          ALIGNED_APK="${UNSIGNED_APK%.apk}-aligned.apk"
          SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-signed.apk"
          
          # 1. 解码并还原 Keystore
          echo "$KEYSTORE_BASE64" | base64 -d > "$APK_DIR/signingKey.jks"
          
          # 2. 定位最新的 Android build-tools
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          
          # 3. Zipalign 对齐
          echo "Running zipalign..."
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          # 4. 自动识别 PrivateKeyEntry 别名
          DETECTED_ALIAS=$(keytool -list -v -keystore "$APK_DIR/signingKey.jks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -B 2 "PrivateKeyEntry" | grep "Alias name:" | sed 's/Alias name: //' | head -n 1 || true)
          SIGNING_ALIAS="${DETECTED_ALIAS:-$KEY_ALIAS}"
          echo "Signing with Alias: $SIGNING_ALIAS"
          
          # 5. 使用 apksigner 签名（显式声明 --ks-type PKCS12）
          echo "Running apksigner..."
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$APK_DIR/signingKey.jks" \
            --ks-type PKCS12 \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          
          # 6. 验证签名有效性
          echo "Verifying signed APK..."
          "$BUILD_TOOLS_DIR/apksigner" verify -v "$SIGNED_APK"
          
          echo "signedReleaseFile=$SIGNED_APK" >> $GITHUB_OUTPUT
          rm -f "$APK_DIR/signingKey.jks" "$ALIGNED_APK"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rlsms-release-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.release_info.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          name: Release ${{ steps.release_info.outputs.tag }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
